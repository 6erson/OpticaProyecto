name: Sync to GitLab

on:
  push:
    branches: [ "main" ] # Cambia a "master" si tu rama principal usa ese nombre

jobs:
  sync-to-gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: "${{ secrets.GITLAB_TOKEN }}"
        run: |
          git remote add gitlab "https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/uth-group2/opticalumenproyecto.git"
          git push gitlab main --force
